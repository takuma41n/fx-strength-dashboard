name: Update FX data

on:
  schedule:
    # 平日 04:40 UTC = 日本時間 13:40。前営業日の米国終値と当日のアジア時間の
    # 値はこの時点で揃っている。GitHub の schedule は混雑で実発火が 1.5〜4 時間
    # 遅れるのが常態（2026-08 実測: 06:10 設定に対し 07:38〜10:03 発火）なので、
    # 遅延を織り込んでも narrative routine（07:40 UTC = 16:40 JST）より先に
    # data.json が着地するよう早めに設定している。
    - cron: "40 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet numpy openpyxl

      - name: Fetch market data
        run: python -u fetch_market.py

      - name: Compute scores
        run: python -u score.py --quiet

      - name: Compute commodity scores
        # コモディティ側の失敗で FX の日次更新を止めない
        continue-on-error: true
        run: python -u score_commodities.py --quiet

      - name: Report backtest
        # 失敗させたくはないが、的中率の推移はログに残しておきたい
        continue-on-error: true
        run: python -u score.py --backtest

      - name: Report commodity backtest
        continue-on-error: true
        run: python -u score_commodities.py --backtest

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "変更なし"
            exit 0
          fi
          git add data.json
          git commit -m "chore: update data.json ($(date -u +%Y-%m-%d))"
          git push
